# Policy for: planned .github/workflows/prof-correctness.yml in DataDog/dd-trace-py
# (dd-trace-py follow-up — workflow not on main yet). Allows dd-trace-py GitHub
# Actions to trigger prof-correctness workflows when profiling code changes.
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:DataDog/dd-trace-py:.*

claim_pattern:
  job_workflow_ref: DataDog/dd-trace-py/.github/workflows/prof-correctness.yml@refs/heads/.*
  ref_type: branch

permissions:
  actions: write
