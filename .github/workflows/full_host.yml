# Path-filtered full_host matrix. Nightly cron matches former leftover ci.yml.
# test.yml is not in paths: treat a reusable-workflow edit as shared
# (run all) — touch each runtime workflow file, or wait for nightly.
name: full_host
on:
  push:
    paths:
      - "scenarios/full_host*/**"
      - ".github/workflows/full_host.yml"
  schedule:
    - cron: "0 0 * * *"
jobs:
  full_host:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: full_host.*
    secrets: inherit
