name: "Downstream: dd-trace-py"
run-name: "dd-trace-py downstream (${{ inputs.dd_trace_py_commit_sha }})"

on:
  workflow_dispatch:
    inputs:
      dd_trace_py_commit_sha:
        description: 'dd-trace-py commit SHA to test against (installs wheels from S3)'
        required: true
        type: string
      test_scenarios:
        description: 'Regexp to select which scenarios to run'
        required: false
        type: string
        default: 'python.*'
      ddtrace_install_url:
        description: 'S3 install script URL (defaults to unsuffixed install.sh for this SHA)'
        required: false
        type: string
        default: ''

jobs:
  python:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: ${{ inputs.test_scenarios }}
      ddtrace_install_url: ${{ inputs.ddtrace_install_url != '' && inputs.ddtrace_install_url || format('https://dd-trace-py-builds.s3.amazonaws.com/{0}/install.sh', inputs.dd_trace_py_commit_sha) }}
    secrets: inherit
