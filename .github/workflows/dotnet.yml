# Path-filtered dotnet matrix. Nightly cron matches leftover ci.yml.
# test.yml is not in paths: treat a reusable-workflow edit as shared
# (run all) — touch each runtime workflow file, or wait for nightly.
name: dotnet
on:
  push:
    paths:
      - "scenarios/dotnet*/**"
      - ".github/workflows/dotnet.yml"
  schedule:
    - cron: "0 0 * * *"
jobs:
  dotnet:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: dotnet.*
    secrets: inherit
