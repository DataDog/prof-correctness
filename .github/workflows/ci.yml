# Leftover monolith after ddprof extraction. on.push.paths omits
# extracted runtimes so a ddprof-only push does not start these jobs.
# Editing this file still starts leftover runtimes.
# test.yml is not in paths: treat a reusable-workflow edit as shared
# (run all) — touch each runtime workflow file, or wait for nightly.
name: prof-correctness
on:
  push:
    paths:
      - "scenarios/full_host*/**"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 0 * * *"
jobs:
  full_host:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: full_host.*
    secrets: inherit
