# Leftover monolith after Python extraction. on.push.paths omits
# scenarios/python* so a Python-only push does not start these jobs.
# Editing this file still starts leftover runtimes.
# test.yml is not in paths: treat a reusable-workflow edit as shared
# (run all) — touch each runtime workflow file, or wait for nightly.
name: prof-correctness
on:
  push:
    paths:
      - "scenarios/ddprof*/**"
      - "scenarios/dotnet*/**"
      - "scenarios/ruby*/**"
      - "scenarios/node*/**"
      - "scenarios/full_host*/**"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 0 * * *"
jobs:
  ddprof:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: ddprof.*
    secrets: inherit
  dotnet:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: dotnet.*
    secrets: inherit
  ruby:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: ruby.*
    secrets: inherit
  node:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: node.*
    secrets: inherit
  full_host:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: full_host.*
    secrets: inherit
