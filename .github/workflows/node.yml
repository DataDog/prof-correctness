# Path-filtered node matrix. Nightly cron matches leftover ci.yml.
# test.yml is not in paths: treat a reusable-workflow edit as shared
# (run all) — touch each runtime workflow file, or wait for nightly.
name: node
on:
  push:
    paths:
      - "scenarios/node*/**"
      - ".github/workflows/node.yml"
  schedule:
    - cron: "0 0 * * *"
jobs:
  node:
    uses: ./.github/workflows/test.yml
    with:
      test_scenarios: node.*
    secrets: inherit
